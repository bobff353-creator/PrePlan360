<meta charset="utf-8">
<title>PrePlan 360 — Preplanning & Response Intelligence</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/preplans-upgrade.css?v=20260813-return-respond">
  <link rel="stylesheet" href="/respond-upgrade.css?v=20260813-boxcards">
  <link rel="stylesheet" href="/roster-upgrade.css?v=20260813-employment-roles">
  <link rel="stylesheet" href="/schedule-upgrade.css?v=20260813-employment-roles">
  <link rel="stylesheet" href="/daily-log-demo.css?v=20260813-daily-log">
  <link rel="stylesheet" href="/owner-upgrade.css?v=20260813-owner-studio">
<style>
  :root{
    --bg:#0d1015; --panel:#161b23; --panel2:#1c222c; --panel3:#222a36; --line:#252c37;
    --ink:#e9edf2; --muted:#8b96a5; --faint:#5b6675;
    --fire:#ff3b30; --fire-dim:#c22a22;
    --ready:#2fbf71; --warn:#ffb020; --disp:#3b9dff; --purple:#a06bff; --ice:#7fd4ff;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;overflow:hidden}
  .app{display:grid;grid-template-columns:230px 1fr;grid-template-rows:56px 1fr;height:100vh;grid-template-areas:"brand top" "nav main"}
  .brand{grid-area:brand;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);background:var(--panel)}
  .logo{width:30px;height:30px;border-radius:7px;background:linear-gradient(150deg,var(--fire),#ff7a3d);display:grid;place-items:center;flex:none}
  .logo svg{width:18px;height:18px}
  .brand b{font-weight:800;letter-spacing:.06em;font-size:15px}
  .brand small{display:block;color:var(--faint);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:700}
  .top{grid-area:top;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel)}
  .chip{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ready);box-shadow:0 0 8px currentColor;color:var(--ready)}
  .dot.warn{background:var(--warn);color:var(--warn)} .dot.fire{background:var(--fire);color:var(--fire)}
  .top .spacer{flex:1}
  .clock{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.04em}
  .clock span{color:var(--faint);font-size:11px;margin-left:6px}
  .tone-btn{background:var(--fire);color:#fff;border:none;padding:8px 14px;border-radius:7px;font-weight:800;letter-spacing:.08em;font-size:11px;text-transform:uppercase;cursor:pointer;transition:.15s}
  .tone-btn:hover{filter:brightness(1.1)} .tone-btn.clear{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
  nav{grid-area:nav;background:var(--panel);border-right:1px solid var(--line);padding:12px 10px;overflow-y:auto}
  .navlabel{color:var(--faint);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;margin:14px 8px 6px}
  .navitem{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--muted);cursor:pointer;font-weight:600;font-size:13.5px;transition:.12s;position:relative}
  .navitem:hover{background:var(--panel2);color:var(--ink)}
  .navitem.active{background:linear-gradient(90deg,rgba(255,59,48,.16),transparent);color:var(--ink)}
  .navitem.active::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;background:var(--fire);border-radius:0 3px 3px 0}
  .navitem svg{width:18px;height:18px;flex:none;opacity:.85}
  .navitem .badge{margin-left:auto;background:var(--fire);color:#fff;font-size:10px;font-weight:800;padding:1px 6px;border-radius:20px;font-family:var(--mono)}
  .navitem .live{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--ready);box-shadow:0 0 8px var(--ready);animation:blink 1.4s infinite}
  @keyframes blink{50%{opacity:.25}}
  main{grid-area:main;overflow-y:auto;padding:22px 26px 60px}
  .head{display:flex;align-items:baseline;gap:12px;margin:0 0 18px}
  .head h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.01em}
  .head .sub{color:var(--muted);font-size:13px}
  .head .eyebrow{color:var(--fire);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:800;margin-bottom:3px}
  .grid{display:grid;gap:14px}
  .g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h3{margin:0 0 12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
  .kpi .n{font-size:30px;font-weight:800;font-family:var(--mono);letter-spacing:-.02em}
  .kpi .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-top:2px}
  .kpi .trend{font-size:11px;font-weight:700;margin-top:8px}
  .up{color:var(--ready)} .down{color:var(--fire)}
  .stripe{border-left:3px solid var(--line);padding-left:12px}
  .stripe.ready{border-color:var(--ready)} .stripe.warn{border-color:var(--warn)} .stripe.fire{border-color:var(--fire)} .stripe.disp{border-color:var(--disp)}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.03em}
  .p-ready{background:rgba(47,191,113,.14);color:var(--ready)}
  .p-warn{background:rgba(255,176,32,.14);color:var(--warn)}
  .p-fire{background:rgba(255,59,48,.16);color:#ff6b62}
  .p-disp{background:rgba(59,157,255,.14);color:var(--disp)}
  .p-muted{background:var(--panel2);color:var(--muted)}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;color:var(--faint);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:10px;border-bottom:1px solid var(--line);font-size:13px}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--panel2)}
  .mono{font-family:var(--mono)}
  .u{font-family:var(--mono);font-weight:700;background:var(--panel2);padding:2px 7px;border-radius:5px;font-size:12px;border:1px solid var(--line)}
  .duty{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
  .duty:last-child{border-bottom:none}
  .duty input{appearance:none;width:20px;height:20px;border:2px solid var(--faint);border-radius:6px;cursor:pointer;flex:none;position:relative;transition:.12s}
  .duty input:checked{background:var(--ready);border-color:var(--ready)}
  .duty input:checked::after{content:"✓";position:absolute;color:#04240f;font-weight:900;font-size:13px;left:3px;top:-2px}
  .duty.done .dtxt{color:var(--faint);text-decoration:line-through}
  .dtxt{flex:1}.dtxt small{display:block;color:var(--faint);font-size:11px}
  .bar{height:7px;background:var(--panel2);border-radius:10px;overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--ready);border-radius:10px}
  #incbanner{display:none;grid-column:1/-1;background:linear-gradient(100deg,var(--fire-dim),#7a1a15);border:1px solid var(--fire);border-radius:12px;padding:16px 18px;align-items:center;gap:18px}
  #incbanner.on{display:flex;animation:pulse 1.8s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,59,48,.5)}50%{box-shadow:0 0 0 10px rgba(255,59,48,0)}}
  #incbanner .big{font-size:20px;font-weight:800}
  #incbanner .lbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#ffd0cc;font-weight:800}
  .searchbox{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--ink);font-size:13px;font-family:var(--sans)}
  .searchbox:focus{outline:2px solid var(--fire);outline-offset:1px}
  .tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:11px;color:var(--muted);margin:2px 4px 2px 0;font-weight:600}
  .hidden{display:none!important}
  .muted{color:var(--muted)}
  .flow{font-family:var(--mono);font-weight:800;font-size:18px}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:7px 12px;border-radius:7px;font-weight:600;font-size:12px;cursor:pointer}
  .btn:hover{border-color:var(--faint)}
  .btn.pri{background:var(--fire);border-color:var(--fire);color:#fff}
  .schematic{background:var(--panel2);border:1px solid var(--line);border-radius:10px;height:230px;position:relative;overflow:hidden}
  .footer-note{color:var(--faint);font-size:11px;margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
  .modtitle{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:22px 0 10px}
  /* calc inputs */
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
  .field label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .field input,.field select{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:8px 10px;color:var(--ink);font-family:var(--sans);font-size:13px}
  .field input:focus,.field select:focus{outline:2px solid var(--fire);outline-offset:1px}
  .result{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:16px;text-align:center}
  .result .big{font-family:var(--mono);font-weight:800;font-size:36px;color:var(--fire);letter-spacing:-.02em}
  /* ICS extras */
  .parring{position:relative;width:120px;height:120px;margin:0 auto}
  .parring svg{transform:rotate(-90deg)}
  .parring .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
  .parring .lbl b{font-family:var(--mono);font-size:26px;font-weight:800}
  .bench{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .bench:last-child{border:none}
  .bench .tick{width:20px;height:20px;border-radius:50%;border:2px solid var(--faint);flex:none;display:grid;place-items:center;font-size:11px;font-weight:900}
  .bench.hit .tick{background:var(--ready);border-color:var(--ready);color:#04240f}
  .bench.hit span{color:var(--faint)}
  .bench .t{margin-left:auto;font-family:var(--mono);color:var(--muted);font-size:12px}
  .mayday{background:var(--fire);color:#fff;border:none;width:100%;padding:14px;border-radius:9px;font-weight:900;letter-spacing:.14em;font-size:14px;cursor:pointer}
  .mayday.armed{animation:pulse 1s infinite}
  .sgrid{display:grid;grid-template-columns:auto repeat(3,1fr);gap:6px;font-size:12px}
  .sgrid .h{color:var(--faint);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding-bottom:4px}
  .scell{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px;text-align:center;font-weight:700;cursor:pointer}
  .scell.p{background:rgba(255,176,32,.14);color:var(--warn);border-color:transparent}
  .scell.c{background:rgba(47,191,113,.14);color:var(--ready);border-color:transparent}
  /* live ops board */
  .board{background:radial-gradient(1200px 400px at 50% -10%,rgba(59,157,255,.08),transparent),var(--bg)}
  .boardhead{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 24px;margin-bottom:14px}
  .boardhead .title h1{margin:0;font-size:30px;font-weight:900;letter-spacing:.02em}
  .boardhead .title p{margin:2px 0 0;color:var(--fire);font-weight:800;letter-spacing:.18em;text-transform:uppercase;font-size:11px}
  .boardhead .bclock{text-align:right}
  .boardhead .bclock strong{font-family:var(--mono);font-size:38px;font-weight:800;display:block;line-height:1}
  .boardhead .bclock span{color:var(--muted);font-size:13px}
  .boardhead .bclock small{display:flex;align-items:center;gap:6px;justify-content:flex-end;color:var(--ready);font-size:11px;font-weight:700;margin-top:4px}
  .boardhead .bclock small i{width:7px;height:7px;border-radius:50%;background:var(--ready);box-shadow:0 0 8px var(--ready);animation:blink 1.4s infinite}
  .bsummary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
  .btile{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ready);border-radius:12px;padding:14px 16px}
  .btile.warn{border-left-color:var(--warn)} .btile.fire{border-left-color:var(--fire);animation:pulse 2s infinite}
  .btile span{color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
  .btile strong{display:block;font-size:19px;font-weight:800;margin-top:5px}
  .btile b{display:block;font-size:13px;color:var(--ink);margin-top:2px;font-weight:600}
  .btile small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
  .rotpanel{min-height:210px}
  .rotdots{display:flex;gap:6px;align-items:center;margin-top:12px}
  .rotdots button{width:8px;height:8px;border-radius:50%;border:none;background:var(--line);cursor:pointer;padding:0}
  .rotdots button.active{background:var(--fire);width:20px;border-radius:5px}
  .rotdots span{margin-left:auto;color:var(--faint);font-size:11px}
  .appstrip{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .appchip{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;border-top:3px solid var(--ready)}
  .appchip.committed{border-top-color:var(--fire)} .appchip.oos{border-top-color:var(--faint);opacity:.6}
  .appchip b{font-family:var(--mono);font-weight:800;font-size:15px;display:block}
  .appchip span{font-size:12px;color:var(--muted)}
  .newsitem{padding:9px 0;border-bottom:1px solid var(--line)}
  .newsitem:last-child{border:none}
  .newsitem time{color:var(--faint);font-size:11px;font-family:var(--mono)}
  .newsitem strong{display:block;font-size:14px;margin-top:2px}
  .boardhead-actions{display:flex;align-items:center;gap:14px}
  .boardcanvas{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
  .board-widget{grid-column:span 6;min-width:0;position:relative}
  .board-widget.w-full{grid-column:1/-1}
  .board-widget.w-third{grid-column:span 4}
  .board-widget.dragging{opacity:.45}
  .board-widget.dragover{outline:2px dashed var(--disp);outline-offset:4px}
  .widget-grip{position:absolute;right:12px;top:10px;z-index:4;display:flex;align-items:center;gap:7px;color:var(--faint);font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:grab;user-select:none}
  .widget-grip b{font-size:18px;line-height:1;letter-spacing:-2px}
  .board-widget>.card{height:100%}
  .board-widget .card h3{padding-right:72px}
  .board-empty{padding:28px;border:1px dashed var(--faint);border-radius:12px;text-align:center;color:var(--muted)}
  .embed-shell{position:relative;margin-top:8px}
  .embed-shell iframe{width:100%;min-height:310px;border:1px solid var(--line);border-radius:9px;background:#fff}
  .embed-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px}
  .config-backdrop{position:fixed;inset:0;z-index:40;background:rgba(3,8,13,.82);display:grid;place-items:center;padding:20px}
  .config-panel{width:min(1040px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 80px rgba(0,0,0,.5)}
  .config-head{position:sticky;top:0;z-index:2;background:var(--panel);display:flex;justify-content:space-between;gap:16px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
  .config-head h2{margin:0;font-size:22px}.config-body{padding:18px 20px 22px}
  .config-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .config-section{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px}
  .config-section.full{grid-column:1/-1}
  .config-section h3{margin:0 0 10px}
  .field{display:grid;gap:6px;margin-top:10px}.field:first-child{margin-top:0}
  .field label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .field input,.field select{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit}
  .checkgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .checkrow{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:12px}
  .checkrow input{accent-color:var(--fire)}
  .source-row{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;align-items:end;margin-top:8px}
  .source-item{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:7px}
  .source-item span{flex:1;min-width:0}.source-item small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--faint)}
  .layout-row{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  .layout-row:last-child{border-bottom:none}.layout-row select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:7px}
  .config-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px}
  .weather-alert{border-left:4px solid var(--warn);padding:10px 12px;background:rgba(255,176,32,.09);border-radius:7px;margin-bottom:10px}
  @media(max-width:1000px){.board-widget,.board-widget.w-third{grid-column:1/-1}.config-grid{grid-template-columns:1fr}.config-section.full{grid-column:auto}}
  @media(max-width:700px){.boardhead{align-items:flex-start}.boardhead-actions{align-items:flex-end;flex-direction:column}.source-row{grid-template-columns:1fr}.checkgrid{grid-template-columns:1fr}.layout-row{grid-template-columns:1fr auto}.layout-row select{grid-column:1/-1}}
  /* Respond in-cab */
  .rsp-call{display:flex;gap:16px;align-items:stretch;background:linear-gradient(100deg,var(--fire-dim),#7a1a15);border:1px solid var(--fire);border-radius:12px;padding:16px 20px;margin-bottom:14px;animation:pulse 2.6s infinite}
  .rsp-call-main{flex:1;min-width:0}
  .rsp-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .rsp-addr{font-size:26px;font-weight:800;letter-spacing:.01em} .rsp-addr span{color:#ffd0cc;font-size:15px;font-weight:600}
  .rsp-narr{color:#ffe3e0;font-size:13.5px;margin-top:4px}
  .rsp-units{margin-top:8px;color:#ffd0cc;font-size:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .rsp-units .u{background:rgba(0,0,0,.25);color:#fff;border-color:rgba(255,255,255,.2)}
  .rsp-eta{flex:none;text-align:center;background:rgba(0,0,0,.22);border-radius:10px;padding:12px 20px;display:flex;flex-direction:column;justify-content:center}
  .rsp-eta .mono{font-family:var(--mono);font-weight:800;font-size:30px;line-height:1} .rsp-eta small{color:#ffd0cc;font-size:10px;letter-spacing:.1em;margin-bottom:6px}
  .rsp-grid{display:grid;grid-template-columns:340px 1fr;gap:14px;align-items:start}
  .rsp-left{display:flex;flex-direction:column;gap:14px}
  .rsp-crit{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
  .rsp-crit span{color:var(--muted);font-size:11px;letter-spacing:.08em} .rsp-crit b{text-align:right;max-width:62%}
  .rsp-hyd,.rsp-unit{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .rsp-hyd:last-child,.rsp-unit:last-child{border:none} .rsp-unit{cursor:pointer} .rsp-unit:hover{background:var(--panel2)}
  .rsp-right{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
  .rsp-viewtabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:10px;padding-bottom:2px}
  .rsp-viewtabs button{background:none;border:none;color:var(--muted);padding:8px 12px;font-weight:600;font-size:12.5px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}

const TODAY="2026-08-12";
const OTLBL={leastOT:"Least overtime worked",leastMandatory:"Least mandatory time",mostSeniority:"Most seniority",leastSeniority:"Least seniority"};
function daysBetween(a,b){const s=Date.parse(a+"T12:00:00Z"),e=Date.parse(b+"T12:00:00Z");return Math.round((e-s)/86400000);}
const CMP={leastOT:(a,b)=>a.ot-b.ot,leastMandatory:(a,b)=>a.mand-b.mand,mostSeniority:(a,b)=>b.sen-a.sen,leastSeniority:(a,b)=>a.sen-b.sen};
function rankBy(list,order){return [...list].sort((a,b)=>{for(const id of order){const r=CMP[id](a,b);if(r)return r;}return a.name.localeCompare(b.name);});}
function otExemptReason(e,mode,s,slot){
 if(s.exemptOffDuty&&e.offDuty)return "Off duty / on leave";
 if(s.exemptAlreadyScheduled&&e.sched)return "Already working that day";
 if(mode==="voluntary"){if(s.exemptDeclined&&e.declined)return "Declined this vacancy";}
 else{if(s.exemptRecentlyMandated&&e.lastMandated){const since=daysBetween(e.lastMandated,slot);if(since>=0&&since<=s.recentDays)return `Mandated ${since}d ago`;}
   if(s.exemptMaxConsecutive&&(e.consec||0)>=s.maxConsecutive)return `${e.consec} consecutive mandates`;}
 return null;}
function classifyAward(d,t){if(d>t.awardDaysOut)return "early";if(d>t.completeByDaysOut)return "award";return "overdue";}
function scoreCandidate(e,maxSen,maxHrs,w){const st=maxSen>0?(e.sen/maxSen)*w.seniorityWeight:0;const ht=maxHrs>0?(1-e.ot/maxHrs)*w.hoursWeight:w.hoursWeight;const ct=e.cross?w.customWeight:0;return st+ht+ct;}

const PAYCATS=[
 ["Regular shift","reg",()=>"reg rate"],["Overtime","ot",()=>`reg × ${PAYSET.otMult} (auto over ${PAYSET.otThreshold}h)`],
 ["Holiday","hol",()=>`reg × ${PAYSET.holMult}`],["Acting Officer","stipend",()=>`+ $${PAYSET.actingStipend.toFixed(2)}/hr stipend`],
 ["DPW Assignment","dpw",()=>`reg × ${PAYSET.dpwMult}`],["Callback","ot",()=>`reg × ${PAYSET.otMult}, 2h min`],["Drill / Training","reg",()=>"reg rate"]];
function otRate(r){return RATES[r].reg*PAYSET.otMult;}
function holRate(r){return RATES[r].reg*PAYSET.holMult;}
function grossBreak(e){
 const rr=RATES[e.rank].reg;const base=e.h.shift+e.h.drill+e.h.callback+e.h.wd;
 const ot=Math.max(base-PAYSET.otThreshold,0);const reg=base-ot;
 const regPay=reg*rr,otPay=ot*otRate(e.rank),holPay=e.h.holiday*holRate(e.rank),acPay=e.h.acting*PAYSET.actingStipend,dpwPay=e.h.dpw*rr*PAYSET.dpwMult;
 let g=regPay+otPay+holPay+acPay+dpwPay;g=PAYSET.roundUp?Math.ceil((g-1e-9)*100)/100:Math.round(g*100)/100;
 return {base,reg,ot,regPay,otPay,holPay,acPay,dpwPay,g};
}
function payIssues(e){
 const b=grossBreak(e),out=[];
 if(!RATES[e.rank])out.push("No pay rate on file for this rank");
 if(e.h.acting>0&&!e.ae)out.push("Acting-officer hours logged but member isn't acting-eligible");
 if(e.h.dpw>0&&!e.isDpw)out.push("DPW hours logged but member isn't DPW-assigned");
 if(b.base>240)out.push("Base hours exceed the 14-day period maximum");
 if(b.ot>40)out.push("High overtime — "+b.ot.toFixed(0)+"h over threshold, verify");
 return out;
}

function rateSet(rank,v){RATES[rank].reg=Math.max(0,+v||0);render();}
function hoursSet(id,cat,v){EMPPAY.find(e=>e.id===id).h[cat]=Math.max(0,+v||0);render();}

function ppTabGo(t){ppTab=t;render();}
function ppPinGo(i){ppPin=ppPin===i?-1:i;if(ppTab!=='systems'&&ppTab!=='overview')ppTab='systems';render();}
function ppToggle(k){ppLayer[k]=!ppLayer[k];render();}
function ppToggleImports(){ppShowImports=!ppShowImports;render();}

function ppMap(p){
 const foot=p.foot.map(c=>c.join(",")).join(" ");
 const pins=ppLayer.pins?p.pins.map((pn,i)=>{const m=PINMETA[pn[0]];const sel=i===ppPin;const col=pn[4]==='OOS'?'var(--fire)':pn[4]==='needs-attention'?'var(--warn)':m[2];return `<g class="ppmap-pin ${sel?'sel':''}" transform="translate(${pn[2]},${pn[3]})" onclick="ppPinGo(${i})" style="cursor:pointer"><circle r="${sel?15:12}" fill="${col}" stroke="#0d1015" stroke-width="2"/><text y="4" text-anchor="middle" font-size="11" font-weight="800" fill="#0d1015">${m[0]}</text>${pn[5]?'<circle r="17" fill="none" stroke="'+col+'" stroke-width="1.5" opacity=".5"/>':''}</g>`;}).join(""):"";

 const sides=ppLayer.sides?Object.entries(p.sides).map(([s,xy])=>`<text x="${xy[0]}" y="${xy[1]}" text-anchor="middle" font-size="17" font-weight="900" fill="var(--fire)" opacity=".85">${s}</text>`).join(""):"";
 const corners=p.foot.map((c,i)=>`<g><circle cx="${c[0]}" cy="${c[1]}" r="4" fill="var(--fire)"/><text x="${c[0]}" y="${c[1]-8}" text-anchor="middle" font-size="9" fill="var(--muted)">${i+1}</text></g>`).join("");
 return `<div class="ppmap">

 if(ppTab==="water"){

 </div>`;
}

/* ---- Add/Edit Pre-Plan · real GPS + Web-Mercator map (from field-preplans.tsx) ---- */
let ppEdit=null,ppEditPin="knox";
const EVBW=900,EVBH=480,EZOOM=19;
function worldXY(lat,lng,z){const s=256*2**z;return {x:(lng+180)/360*s,y:(1-Math.asinh(Math.tan(lat*Math.PI/180))/Math.PI)/2*s};}
function projLL(lat,lng,c,z,w,h){const p=worldXY(lat,lng,z),o=worldXY(c.lat,c.lng,z);return {x:w/2+p.x-o.x,y:h/2+p.y-o.y};}
function unprojLL(x,y,c,z,w,h){const s=256*2**z;const cx=(c.lng+180)/360*s,cy=(1-Math.asinh(Math.tan(c.lat*Math.PI/180))/Math.PI)/2*s;const wx=cx+x-w/2,wy=cy+y-h/2;return {lng:wx/s*360-180,lat:Math.atan(Math.sinh(Math.PI*(1-2*wy/s)))*180/Math.PI};}
function polyAreaSqft(pts){if(pts.length<3)return 0;const R=6378137,mLat=pts.reduce((s,p)=>s+p.lat,0)/pts.length*Math.PI/180;const pr=pts.map(p=>({x:R*p.lng*Math.PI/180*Math.cos(mLat),y:R*p.lat*Math.PI/180}));const t2=pr.reduce((s,p,i)=>{const n=pr[(i+1)%pr.length];return s+p.x*n.y-n.x*p.y;},0);return Math.abs(t2)/2*10.7639;}
function centroidLL(p){return {lat:p.reduce((s,x)=>s+x.lat,0)/p.length,lng:p.reduce((s,x)=>s+x.lng,0)/p.length};}
function eProj(ll){return projLL(ll.lat,ll.lng,ppEdit.center,EZOOM,EVBW,EVBH);}
function ppNew(){ppEdit={mode:"footprint",center:{lat:41.8189,lng:-87.7734},gps:null,foot:[],pins:[],aSide:null,photos:{},editingId:null,form:{name:"",addr:"",floors:1,cType:"VB",occ:"other",spr:"none",fdc:"",knox:"",access:"",contacts:"",haz:""},msg:'Tap "◎ Use my GPS" to center on your location, then tap the map to drop footprint corners.'};render();}
function ppEditExisting(id){const p=PREPLANS.find(x=>x.id===id);const g=p.geo;ppEdit={mode:"footprint",center:(g&&g.center)||{lat:41.8189,lng:-87.7734},gps:(g&&g.gps)||null,foot:(g&&g.footLL)||[],pins:(g&&g.pinsLL)||[],aSide:(g&&g.aSideLL)||null,photos:(g&&g.photoData)||{},editingId:id,form:{name:p.name,addr:p.addr,floors:p.floors,cType:p.cType,occ:p.occ,spr:p.spr,fdc:p.fdc,knox:p.knox,access:p.access,contacts:p.contacts,haz:p.haz.map(h=>h[0]).join(", ")},msg:g?"Editing geo-located record — adjust corners, re-capture GPS, or add photos.":"Legacy record. Tap the map (or use GPS) to capture its real footprint and geo-enable it."};render();}
function ppEditPhoto(side,input){const f=input.files&&input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{ppEdit.photos[side]=r.result;render();};r.readAsDataURL(f);}
function ppUseGps(){if(!navigator.geolocation){ppEdit.msg="Geolocation not available in this browser.";render();return;}ppEdit.msg="Locating… allow location access.";render();navigator.geolocation.getCurrentPosition(p=>{ppEdit.center={lat:p.coords.latitude,lng:p.coords.longitude};ppEdit.gps={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)};if(!ppEdit.foot.length)ppEdit.msg="GPS locked ±"+ppEdit.gps.acc+"m. Now tap the map to drop footprint corners.";else ppEdit.msg="GPS re-centered ±"+ppEdit.gps.acc+"m.";render();},e=>{ppEdit.msg="GPS unavailable ("+e.message+"). Tap the map to place points manually.";render();},{enableHighAccuracy:true,timeout:9000});}
function ppEditMode(m){ppEdit.mode=m;render();}
function ppEditPinMode(){ppEdit.mode="pin:"+ppEditPin;render();}
function ppEditClick(ev){const r=ev.currentTarget.getBoundingClientRect();const x=(ev.clientX-r.left)/r.width*EVBW,y=(ev.clientY-r.top)/r.height*EVBH;const ll=unprojLL(x,y,ppEdit.center,EZOOM,EVBW,EVBH);const m=ppEdit.mode;if(m==="footprint")ppEdit.foot.push(ll);else if(m==="aSide"){ppEdit.aSide=ll;ppEdit.mode="footprint";}else if(m.startsWith("pin:")){const t=m.slice(4);ppEdit.pins.push({type:t,label:PINMETA[t][1],ll,status:"normal",critical:false,floor:"1",side:""});}render();}
function ppEditUndo(){ppEdit.foot.pop();render();}
function ppEditClear(){ppEdit.foot=[];ppEdit.pins=[];ppEdit.aSide=null;render();}
function ppEditNum(f,v){ppEdit.form[f]=v;render();}
function ppEditCancel(){ppEdit=null;render();}
function ppEditSave(){
 if(ppEdit.foot.length<3){ppEdit.msg="Place at least 3 footprint corners before saving.";render();return;}
 const sqft=Math.round(polyAreaSqft(ppEdit.foot));const f=ppEdit.form;
 const all=[...ppEdit.foot,...ppEdit.pins.map(p=>p.ll)];if(ppEdit.aSide)all.push(ppEdit.aSide);
 const lats=all.map(p=>p.lat),lngs=all.map(p=>p.lng);const mnLa=Math.min(...lats),mxLa=Math.max(...lats),mnLo=Math.min(...lngs),mxLo=Math.max(...lngs);
 const laR=Math.max(mxLa-mnLa,1e-6),loR=Math.max(mxLo-mnLo,1e-6),NW=1000,NH=560,P=140;

  <div class="card" style="margin-bottom:14px"><h3>◈ First-Due Zone Register — click a hydrant</h3>

    ${HYDRANTS.map(x=>{const avail=x.status==="oos"?0:availableHydrantFlow(x.measured,x.stat,x.resid);const c=nfpa291(avail);const col={Blue:['rgba(59,157,255,.15)','var(--disp)'],Green:['rgba(47,191,113,.15)','var(--ready)'],Orange:['rgba(255,176,32,.15)','var(--warn)'],Red:['rgba(255,59,48,.16)','#ff6b62']}[c.cls];return `<tr onclick="hydSelGo('${x.id}')" style="cursor:pointer;${x.id===hydSel?'background:var(--panel2)':''}"><td><span class="u">${x.id}</span></td><td>${x.loc}</td><td><span class="pill" style="background:${col[0]};color:${col[1]}">● ${x.status==="oos"?"OOS":c.cls}</span></td><td class="mono">${x.status==="oos"?"—":Math.round(avail).toLocaleString()+" GPM"}</td><td class="mono muted">${x.last}</td><td>${pill(x.status)}</td></tr>`;}).join("")}
    </tbody></table>
    <div class="muted" style="font-size:12px;margin-top:10px">NFPA 291 color: <b style="color:var(--disp)">Blue</b> ≥1500 · <b style="color:var(--ready)">Green</b> 1000–1499 · <b style="color:var(--warn)">Orange</b> 500–999 · <b style="color:#ff6b62">Red</b> &lt;500 / OOS.</div>
  </div>
  <div class="pp-hero"><div><div style="display:flex;align-items:center;gap:10px"><h2 style="margin:0;font-size:18px">${h.id}</h2><span class="pill ${h.status==="oos"?"p-fire":"p-ready"}">${h.status==="oos"?"Out of service":"In service"}</span></div><div class="muted" style="font-size:13px">${h.loc} · ${h.mfr} ${h.model} · ports ${h.ports.join(" · ")}</div></div><button class="btn" onclick="hydStatus('${h.id}')">${h.status==="oos"?"Return to service":"Tag out of service"}</button></div>
  <div class="pp-tabs">${[["flow","NFPA 291 Flow Test"],["flush","Flushing"],["profile","Profile"]].map(t=>`<button class="${hydTab===t[0]?'active':''}" onclick="hydTabGo('${t[0]}')">${t[1]}</button>`).join("")}</div>
  <div class="pp-tabbody">${hydBody(h)}</div>`+footer();
}
function hydBody(h){
 if(hydTab==="flow"){
  return `<div class="grid g2">
    <div class="card"><h3>◈ Guided Flow Test — ${h.id}</h3>
      <div class="grid g2"><div class="field"><label>Static pressure (psi)</label><input id="ht_s" type="number" value="${h.stat||60}"></div><div class="field"><label>Residual while flowing (psi)</label><input id="ht_r" type="number" value="${h.resid||44}"></div></div>
      <div class="grid g2"><div class="field"><label>Desired residual (psi)</label><input id="ht_d" type="number" value="20"></div><div class="field"><label>Flow outlet diameter (in)</label><input id="ht_dia" type="number" step="0.25" value="2.5"></div></div>
      <div class="grid g2"><div class="field"><label>Pitot pressure (psi)</label><input id="ht_p" type="number" value="22"></div><div class="field"><label>Outlet coefficient</label><select id="ht_c" class="searchbox"><option value="0.9">0.90 · smooth / rounded</option><option value="0.8">0.80 · square / sharp</option><option value="0.7">0.70 · projecting</option></select></div></div>
      <button class="btn pri" style="width:100%;margin-top:6px" onclick="hydRecordFlow()">Record Flow Test</button>
    </div>
    <div class="card" style="display:flex;flex-direction:column;justify-content:center">
      <div class="result"><div class="muted" style="font-size:11px;letter-spacing:.15em">MEASURED DISCHARGE</div><div class="mono" id="ht_meas" style="font-size:22px;font-weight:800">—</div>
        <div class="muted" style="font-size:11px;letter-spacing:.15em;margin-top:8px">AVAILABLE @ 20 PSI</div><div class="big" id="ht_out">—</div><div id="ht_cls" style="margin-top:4px"></div></div>
      <div class="muted" style="font-size:11px;margin-top:10px">Q = 29.83 × C × d² × √p &nbsp;·&nbsp; Available = Q × ((Static−Desired) ÷ (Static−Residual))<sup>0.54</sup> — exact formulas from <b>hydrant-flow.ts</b>.</div>
    </div>
  </div>
  <div class="card" style="margin-top:14px"><h3>◈ Flow Test History</h3>
    ${h.flowTests.length?`<table><thead><tr><th>Date</th><th>Static</th><th>Residual</th><th>Pitot</th><th>Measured</th><th>Available</th><th>By</th></tr></thead><tbody>${h.flowTests.map(t=>`<tr><td class="mono">${t.date}</td><td class="mono">${t.stat}</td><td class="mono">${t.resid}</td><td class="mono">${t.pitot}</td><td class="mono">${t.measured.toLocaleString()}</td><td class="mono" style="font-weight:700">${t.avail.toLocaleString()} GPM</td><td class="muted">${t.by}</td></tr>`).join("")}</tbody></table>`:'<p class="muted">No flow tests recorded. Run one above.</p>'}
  </div>`;
 }
 if(hydTab==="flush"){
  return `<div class="grid g2">
    <div class="card"><h3>◈ Add Flushing Record — ${h.id}</h3>
      <label class="sch-rule"><span>Water ran clear</span><input type="checkbox" id="hf_clear" checked></label>
      <div class="field"><label>Notes / issues</label><input id="hf_note" class="searchbox" placeholder="Discoloration, debris, flow time…"></div>
      <button class="btn pri" onclick="hydRecordFlush()">Save Flushing Record</button>
    </div>
    <div class="card"><h3>◈ Flushing History</h3>
      ${h.flushes.length?h.flushes.map(f=>`<div class="callrow"><span class="mono muted">${f.date}</span><span class="pill ${f.clear?'p-ready':'p-warn'}">${f.clear?'Clear':'Discolored'}</span><span style="flex:1;font-size:12px">${f.note}</span><span class="muted" style="font-size:11px">${f.by}</span></div>`).join(""):'<p class="muted">No flushing records yet.</p>'}
    </div>
  </div>`;
 }
 const avail=h.status==="oos"?0:availableHydrantFlow(h.measured,h.stat,h.resid),c=nfpa291(avail);
 return `<div class="card"><h3>◈ Hydrant Profile</h3>
   <div class="grid g3">
     ${[["Manufacturer",h.mfr],["Model",h.model],["Ports",h.ports.join(" · ")],["Last static",h.stat?h.stat+" psi":"—"],["Last residual",h.resid?h.resid+" psi":"—"],["Rated available",h.status==="oos"?"OOS":Math.round(avail).toLocaleString()+" GPM · "+c.cls],["Last flow test",h.last],["Last flush",h.flushes[0]?h.flushes[0].date:"No record"],["Status",h.status==="oos"?"Out of service":"In service"]].map(r=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="muted" style="font-size:11px">${r[0]}</div><b>${r[1]}</b></div>`).join("")}
   </div>
   ${h.notes?`<div class="stripe ${h.status==="oos"?'fire':'warn'}" style="padding:8px 12px;margin-top:12px">${h.notes}</div>`:''}
 </div>`;
}
function wireHyd(){
 const el=id=>document.getElementById(id);if(!el("ht_s"))return;
 const upd=()=>{const measured=hydrantOutletFlow(+val("ht_dia"),+val("ht_p"),+val("ht_c"));const a=availableHydrantFlow(measured,+val("ht_s"),+val("ht_r"),+val("ht_d")||20);const c=nfpa291(a);
   el("ht_meas").textContent=measured?Math.round(measured).toLocaleString()+" GPM":"—";
   el("ht_out").textContent=a?Math.round(a).toLocaleString()+" GPM":"—";
   const col={Blue:'var(--disp)',Green:'var(--ready)',Orange:'var(--warn)',Red:'#ff6b62'}[c.cls];
   el("ht_cls").innerHTML=a?`<span class="pill" style="background:rgba(255,255,255,.06);color:${col};font-size:13px">● Class ${c.code} · ${c.cls}</span>`:'<span class="muted">Enter valid data (static &gt; residual)</span>';
 };
 ["ht_s","ht_r","ht_d","ht_dia","ht_p","ht_c"].forEach(id=>{el(id).oninput=upd;el(id).onchange=upd;});upd();
}

function footer(){return `<div class="footer-note"><b>Fictional demo data:</b> every department, person, property, address, incident, phone number, and mutual-aid agency shown here is invented for demonstration. Fire-flow and hydrant calculations use real formulas, but no record is connected to live CAD or a real department.</div>`;}

/* ============ TIMERS ============ */
function toggleTone(){
 toneOn=!toneOn;
 const b=document.getElementById("toneBtn"),d=document.getElementById("statdot"),w=document.getElementById("statword");
 if(toneOn){b.textContent="■ Clear Incident";b.classList.add("clear");d.className="dot fire";w.textContent="INCIDENT — RESPONDING";t0=performance.now();ICS=newICS();current="respond";}
 else{b.textContent="◉ Tone Out";b.classList.remove("clear");d.className="dot";w.textContent="Station In Service";ICS=null;RSP=null;}
 buildNav();render();
}
let t0=0;
setInterval(()=>{ // master 1s tick
 const el=document.getElementById("etimer");
 if(toneOn&&el){const s=Math.floor((performance.now()-t0)/1000)+712;el.textContent=String(Math.floor(s/60)).padStart(2,'0')+":"+String(s%60).padStart(2,'0');}
 if(ICS&&ICS.par.status==='running'){ICS.par.remaining=Math.max(0,ICS.par.remaining-1);const l=document.getElementById("parlbl");if(l){const pr=ICS.par.remaining;l.textContent=String(Math.floor(pr/60)).padStart(2,'0')+":"+String(pr%60).padStart(2,'0');const c=document.getElementById("parc");if(c){const circ=2*Math.PI*52;c.setAttribute("stroke-dashoffset",circ*(1-pr/(ICS.par.interval*60)));c.setAttribute("stroke",pr<300?'var(--fire)':'var(--ready)');}}}
 tickClock();
 const bc=document.getElementById("bclk");if(bc){const d=new Date();bc.textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});document.getElementById("bdate").textContent=d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});}
},1000);
// customizable board rotation; live-ops-custom.js sets the selected interval
var nextBoardRotateAt=Date.now()+8000;
setInterval(()=>{if(current==='board'&&Date.now()>=nextBoardRotateAt){cycleRot();}},1000);
function dateStr(){return new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});}
function tickClock(){const d=new Date(),p=n=>String(n).padStart(2,'0');const c=document.getElementById("clock");if(c)c.innerHTML=`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}<span>SHIFT B</span>`;}

buildNav();render();
</script>
